        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .site-header {
            background-color: #f9fbf9 !important;
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            padding: 15px 20px !important;
            border-bottom: 2px solid #333 !important;
            height: 70px !important;
            box-sizing: border-box !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
        }
        .header-left {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            font-weight: bold !important;
            font-size: 1.2rem !important;
            color: #333 !important;
            white-space: nowrap !important;
        }
        .header-right {
            width: 100% !important;
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            gap: 20px !important;
            font-weight: bold !important;
            font-size: 14px !important;
        }
        .nav-link {
            text-decoration: none !important;
            color: #333 !important;
            white-space: nowrap !important;
            font-weight: bold !important;
            font-size: 16px !important;
        }
        .product-detail-container {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 60px;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        .product-visual {
            width: 100%;
        }
        .product-visual img {
            width: 100%;
            height: auto;
            display: block;
        }
        .product-desc {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            text-align: center;
        }
        .product-tag {
            display: inline-block;
            background: #a8c1a3;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }
        .product-name { font-size: 2.5rem; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
        .product-price { font-size: 1.5rem; font-weight: bold; margin-bottom: 30px; color: #444; }
        .product-text { line-height: 1.8; color: #666; margin-bottom: 30px; }
        .site-footer { text-align: center; padding: 40px 0; border-top: 1px solid #eee; background: #fff; }
        @media (max-width: 768px) {
            .product-name { font-size: 1.8rem; }
            .header-right { gap: 10px; }
