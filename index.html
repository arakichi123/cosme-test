<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化粧品サイト | Nature Breathe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        .site-header {
            background-color: #ffff00 !important;
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            padding: 15px 20px !important;
            border-bottom: 2px solid #333 !important;
            height: 70px !important;
            box-sizing: border-box !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
        }

        .header-left {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
            font-weight: bold !important;
            font-size: 1.2rem !important;
            color: #333 !important;
            white-space: nowrap !important;
        }

        .header-right {
            width: 100% !important;
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            gap: 20px !important;
            font-weight: bold !important;
            font-size: 14px !important;
        }

        .nav-link {
            text-decoration: none !important;
            color: #333 !important;
            white-space: nowrap !important;
            font-weight: bold !important;
            font-size: 16px !important;
        }

        .search-form {
            display: flex !important;
            width: 250px !important;
        }

        .search-input {
            width: 100% !important;
            padding: 8px 12px !important;
            border: 1px solid #333 !important;
            border-right: none !important;
            border-radius: 4px 0 0 4px !important;
            outline: none !important;
            font-size: 14px !important;
            background-color: #fff !important;
        }

        .search-btn {
            padding: 8px 15px !important;
            background-color: #333 !important;
            color: #fff !important;
            border: 1px solid #333 !important;
            border-radius: 0 4px 4px 0 !important;
            cursor: pointer !important;
            font-weight: bold !important;
            white-space: nowrap !important;
        }
    </style>
</head>

<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="header-left">サンプルサイト</div>
            <div class="header-right">
                <a href="index.html" class="nav-link">TOPへ戻る</a>
                <form class="search-form" action="index.html" method="get">
                    <input type="text" name="q" class="search-input" placeholder="サイト内検索...">
                    <button type="submit" class="search-btn">検索</button>
                </form>
            </div>
        </header>

        <section class="hero-slider">
            <a href="product1.html" class="slide active"><img src="assets/images/banner1.png" alt="Lotion"></a>
            <a href="product2.html" class="slide"><img src="assets/images/banner2.png" alt="Serum"></a>
            <a href="product3.html" class="slide"><img src="assets/images/banner3.png" alt="Cream"></a>
            <a href="product4.html" class="slide"><img src="assets/images/banner4.png" alt="Wash"></a>
            <a href="product5.html" class="slide"><img src="assets/images/banner5.png" alt="UV"></a>
            <a href="product6.html" class="slide"><img src="assets/images/banner6.png" alt="Oil"></a>
            <a href="product7.html" class="slide"><img src="assets/images/banner7.png" alt="Body"></a>
        </section>

        <section class="news-section container">
            <h2 class="section-title">News</h2>
            <div class="news-list">
                <div class="news-item"><a href="product1.html">・5月1日：新工場オープンのお知らせ</a></div>
                <div class="news-item"><a href="product2.html">・4月15日：ゴールデンウィークの営業について</a></div>
                <div class="news-item"><a href="product3.html">・4月1日：新製品「プレミアムセラム」発売</a></div>
                <div class="news-item"><a href="product4.html">・3月20日：春のスキンケアキャンペーン開始</a></div>
                <div class="news-item"><a href="product5.html">・3月10日：メディア掲載情報</a></div>
            </div>
        </section>

        <div class="number-links-wrapper">
            <div class="container">
                <h2 class="section-title">Pick Up</h2>
            </div>
            <section class="number-links">
                <button class="slider-arrow slider-prev">&#10094;</button>
                <button class="slider-arrow slider-next">&#10095;</button>
                <div class="carousel-track">
                    <a href="product1.html" class="num-card"><img src="assets/images/banner1.png" alt="Lotion"></a>
                    <a href="product2.html" class="num-card"><img src="assets/images/banner2.png" alt="Serum"></a>
                    <a href="product3.html" class="num-card"><img src="assets/images/banner3.png" alt="Cream"></a>
                    <a href="product4.html" class="num-card"><img src="assets/images/banner4.png" alt="Wash"></a>
                    <a href="product5.html" class="num-card"><img src="assets/images/banner5.png" alt="UV"></a>
                    <a href="product6.html" class="num-card"><img src="assets/images/banner6.png" alt="Oil"></a>
                    <a href="product7.html" class="num-card"><img src="assets/images/banner7.png" alt="Body"></a>
                </div>
            </section>
        </div>

        <footer class="site-footer">
            <div class="copyright-text">
                &copy; 2026 Nature Breathe. All Rights Reserved.
            </div>
        </footer>
    </div>
    <script src="main.js"></script>
</body>

</html>
