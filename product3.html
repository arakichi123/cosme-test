<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製品詳細 | Nature Breathe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        .site-header { background-color: #ffff00 !important; display: flex !important; justify-content: flex-end !important; align-items: center !important; padding: 15px 20px !important; border-bottom: 2px solid #333 !important; height: 70px !important; box-sizing: border-box !important; position: sticky !important; top: 0 !important; z-index: 1000 !important; }
        .header-left { position: absolute !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; font-weight: bold !important; font-size: 1.2rem !important; color: #333 !important; white-space: nowrap !important; }
        .header-right { width: 100% !important; display: flex !important; justify-content: flex-end !important; align-items: center !important; gap: 20px !important; font-weight: bold !important; font-size: 14px !important; }
        .nav-link { text-decoration: none !important; color: #333 !important; white-space: nowrap !important; font-weight: bold !important; font-size: 16px !important; }
        .product-detail-container { max-width: 1000px; margin: 60px auto; padding: 0 20px; display: flex; gap: 50px; align-items: flex-start; }
        .product-visual { flex: 1; }
        .product-visual img { width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .product-desc { flex: 1; }
        .product-tag { display: inline-block; background: #e0c56e; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 15px; }
        .product-name { font-size: 2.5rem; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
        .product-price { font-size: 1.5rem; font-weight: bold; margin-bottom: 30px; color: #444; }
        .product-text { line-height: 1.8; color: #666; margin-bottom: 30px; }
        .btn-buy { display: inline-block; background: #333; color: #fff; padding: 15px 40px; text-decoration: none; border-radius: 4px; font-weight: bold; transition: background 0.3s; }
        .site-footer { text-align: center; padding: 40px; border-top: 1px solid #eee; }
        @media (max-width: 768px) { .product-detail-container { flex-direction: column; } }
    </style>
</head>
<body>
    <header class="site-header"><div class="header-left">サンプルサイト</div><div class="header-right"><a href="index.html" class="nav-link">TOPへ戻る</a></div></header>
    <main class="product-detail-container">
        <div class="product-visual"><img src="assets/images/banner3.png" alt="Product 3"></div>
        <div class="product-desc">
            <span class="product-tag">LIMITED ITEM</span>
            <h1 class="product-name">Enrich Moist Cream</h1>
            <p class="product-price">¥6,500 (税込)</p>
            <div class="product-text">
                <p>夜の間に肌を修復し、翌朝の肌をふっくらと整える高機能クリーム。オーガニックシアバターとスクワランを贅沢に配合しました。</p>
                <p>お手入れの最後に、パール1粒大を手に取り、お顔全体に包み込むようになじませてください。香りに癒されながらリラックスした睡眠を。</p>
            </div>
            <a href="#" class="btn-buy">カートに追加する</a>
        </div>
    </main>
    <footer class="site-footer"><div class="copyright-text">&copy; 2026 Nature Breathe. All Rights Reserved.</div></footer>
</body>
</html>
